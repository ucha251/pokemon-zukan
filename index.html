<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>ポケモン図鑑 金銀クリスタル</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; color: #333; padding-bottom: 40px; }
  .header { background: linear-gradient(135deg, #d32f2f, #b71c1c); color: white; padding: 16px; border-radius: 14px; text-align: center; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(211,47,47,0.3); }
  .filter-box { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-box { flex: 1; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
  .type-select { padding: 12px; font-size: 14px; border-radius: 10px; border: 1px solid #ccc; background: white; }
  .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .poke-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 4px 10px; border-radius: 12px; color: white; font-size: 11px; font-weight: bold; display: inline-block; }
  
  /* 全17タイプカラー（金銀仕様） */
  .type-ノーマル { background: #9e9e9e; }
  .type-ほのお { background: #f44336; }
  .type-みず { background: #2196f3; }
  .type-でんき { background: #fbc02d; color: #333; }
  .type-くさ { background: #4caf50; }
  .type-こおり { background: #4dd0e1; color: #333; }
  .type-かくとう { background: #d84315; }
  .type-どく { background: #9c27b0; }
  .type-じめん { background: #d7ccc8; color: #333; }
  .type-ひこう { background: #90caf9; color: #333; }
  .type-エスパー { background: #e91e63; }
  .type-むし { background: #8bc34a; }
  .type-いわ { background: #8d6e63; }
  .type-ゴースト { background: #5e35b1; }
  .type-ドラゴン { background: #3949ab; }
  .type-あく { background: #424242; }
  .type-はがね { background: #78909c; }
  .type-\?\?\? { background: #689f38; }

  .cat-物理 { background: #e65100; }
  .cat-特殊 { background: #1565c0; }
  .cat-変化 { background: #757575; }

  .section-title { font-weight: bold; margin-top: 14px; margin-bottom: 6px; border-left: 4px solid #d32f2f; padding-left: 8px; font-size: 14px; }
  .evo-box { background: #fff8e1; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; font-size: 14px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; min-width: 300px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px 4px; text-align: left; }
  th { background: #fafafa; color: #666; font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; }
  .tab { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; background: #eee; cursor: pointer; font-size: 13px; font-weight: bold; }
  .tab.active { background: #d32f2f; color: white; }
  .crystal-tag { background: #00bcd4; color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; margin-left: 4px; }
  .extra-box { background: #f5f7fa; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:0;">📱 ポケモン図鑑 (No.1〜251)</h2>
  <div style="font-size:12px; margin-top:4px;">金・銀・クリスタル 完全対応版</div>
</div>

<div class="filter-box">
  <input type="text" id="search" class="search-box" placeholder="名前・図鑑Noで検索" oninput="render()">
  <select id="typeFilter" class="type-select" onchange="render()">
    <option value="">全タイプ</option>
    <option value="ノーマル">ノーマル</option><option value="ほのお">ほのお</option><option value="みず">みず</option>
    <option value="でんき">でんき</option><option value="くさ">くさ</option><option value="こおり">こおり</option>
    <option value="かくとう">かくとう</option><option value="どく">どく</option><option value="じめん">じめん</option>
    <option value="ひこう">ひこう</option><option value="エスパー">エスパー</option><option value="むし">むし</option>
    <option value="いわ">いわ</option><option value="ゴースト">ゴースト</option><option value="ドラゴン">ドラゴン</option>
    <option value="あく">あく</option><option value="はがね">はがね</option>
  </select>
</div>

<div id="list">データを読み込み中...</div>

<script>
let movesDB = {};
let pokedex = [];
let currentTabs = {};

// 外部JSONファイルを読み込む
async function init() {
  try {
    const [movesRes, pokeRes] = await Promise.all([
      fetch('./moves.json'),
      fetch('./pokedex.json')
    ]);
    movesDB = await movesRes.json();
    pokedex = await pokeRes.json();
    render();
  } catch (e) {
    document.getElementById("list").innerHTML = 
      `<div class="card" style="color:red;"><b>エラー：</b>JSONファイルが読み込めませんでした。<br>VS Codeの「Live Server」などで開いてください。</div>`;
  }
}

function setTab(no, tabName) {
  currentTabs[no] = tabName;
  render();
}

function renderMoveRow(moveName, badgeHtml = "", levelText = "-") {
  const m = movesDB[moveName] || { type: "???", category: "変化", power: "?", pp: "?" };
  return `<tr>
    <td>${levelText}</td>
    <td><b>${moveName}</b>${badgeHtml}</td>
    <td><span class="badge type-${m.type}">${m.type}</span></td>
    <td><span class="badge cat-${m.category}">${m.category}</span></td>
    <td>${m.power}</td>
    <td>${m.pp}</td>
  </tr>`;
}

function render() {
  const q = document.getElementById("search").value.trim();
  const typeF = document.getElementById("typeFilter").value;
  const list = document.getElementById("list");
  list.innerHTML = "";

  const filtered = pokedex.filter(p => {
    const matchText = p.name.includes(q) || String(p.no).includes(q);
    const matchType = typeF === "" || p.types.includes(typeF);
    return matchText && matchType;
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div class="card">該当するポケモンが見つかりません。</div>`;
    return;
  }

  filtered.forEach(p => {
    const activeTab = currentTabs[p.no] || "level";
    const typesHtml = p.types.map(t => `<span class="badge type-${t}">${t}</span>`).join("");
    const evoHtml = p.evolutions && p.evolutions.length
      ? p.evolutions.map(e => `<div class="evo-box">➡ <b>${e.to}</b>（${e.method}：${e.condition}）</div>`).join("")
      : `<div class="evo-box">進化なし</div>`;

    let movesHtml = "";
    if (activeTab === "level") {
      movesHtml = (p.level_up_moves || []).map(item => {
        const ver = item.version === "クリスタル" ? `<span class="crystal-tag">クリスタル</span>` : "";
        return renderMoveRow(item.move, ver, "Lv." + item.level);
      }).join("");
    } else if (activeTab === "tm") {
      movesHtml = (p.tm_moves || []).map(m => renderMoveRow(m, "", "技マシン")).join("");
    } else if (activeTab === "hm") {
      movesHtml = (p.hm_moves || []).map(m => renderMoveRow(m, "", "秘伝")).join("");
    }

    let extraHtml = "";
    if (p.extra && Object.keys(p.extra).length > 0) {
      extraHtml = `<div class="section-title">追加データ</div><div class="extra-box">` +
        Object.entries(p.extra).map(([k, v]) => `<div><b>${k}：</b>${v}</div>`).join("") + `</div>`;
    }

    list.innerHTML += `
      <div class="card">
        <div class="poke-title">No.${String(p.no).padStart(3, '0')} ${p.name} ${typesHtml}</div>
        <div class="section-title">進化</div>
        ${evoHtml}
        <div class="tabs">
          <div class="tab ${activeTab==='level'?'active':''}" onclick="setTab(${p.no},'level')">レベルアップ</div>
          <div class="tab ${activeTab==='tm'?'active':''}" onclick="setTab(${p.no},'tm')">技マシン</div>
          <div class="tab ${activeTab==='hm'?'active':''}" onclick="setTab(${p.no},'hm')">秘伝マシン</div>
        </div>
        <div class="table-wrap">
          <table>
            <tr><th>条件</th><th>技名</th><th>タイプ</th><th>分類</th><th>威力</th><th>PP</th></tr>
            ${movesHtml || '<tr><td colspan="6">なし</td></tr>'}
          </table>
        </div>
        ${extraHtml}
      </div>
    `;
  });
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポケモン金銀クリスタル 完全図鑑＆攻略マップ</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
      margin: 0; padding: 0; background-color: #f4f6f9; color: #333; padding-bottom: 80px;
    }
    header {
      background: linear-gradient(135deg, #d4af37, #b5952f);
      color: #fff; text-align: center; padding: 14px 10px;
      font-size: 18px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .tabs {
      display: flex; background: #fff; border-bottom: 1px solid #ddd;
      position: sticky; top: 50px; z-index: 99;
    }
    .tab-btn {
      flex: 1; padding: 12px 5px; border: none; background: none;
      font-size: 14px; font-weight: bold; color: #666; cursor: pointer;
      border-bottom: 3px solid transparent; transition: 0.2s;
    }
    .tab-btn.active { color: #b5952f; border-bottom-color: #d4af37; background: #fffdf5; }

    .container { max-width: 800px; margin: 0 auto; padding: 12px; }
    .search-box {
      width: 100%; padding: 10px 14px; font-size: 15px;
      border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px;
      background: #fff; outline: none;
    }
    .search-box:focus { border-color: #d4af37; }

    /* ポケモン一覧カード */
    .poke-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .poke-card {
      background: #fff; border-radius: 10px; padding: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06); cursor: pointer;
      transition: transform 0.15s; border: 1px solid #eee;
    }
    .poke-card:active { transform: scale(0.97); }
    .poke-no { font-size: 11px; color: #888; font-weight: bold; }
    .poke-name { font-size: 16px; font-weight: bold; margin: 4px 0 6px; }
    .type-badge {
      display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px;
      color: #fff; font-weight: bold; margin-right: 4px; background: #777;
    }

    /* タイプ別カラー */
    .type-ノーマル { background: #a8a878; } .type-ほのお { background: #f08030; }
    .type-みず { background: #6890f0; } .type-でんき { background: #f8d030; color: #333; }
    .type-くさ { background: #78c850; } .type-こおり { background: #98d8d8; color: #333; }
    .type-かくとう { background: #c03028; } .type-どく { background: #a040a0; }
    .type-じめん { background: #e0c068; color: #333; } .type-ひこう { background: #a890f0; }
    .type-エスパー { background: #f85888; } .type-むし { background: #a8b820; }
    .type-いわ { background: #b8a038; } .type-ゴースト { background: #705898; }
    .type-ドラゴン { background: #7038f8; } .type-あく { background: #705848; }
    .type-はがね { background: #b8b8d0; color: #333; }

    /* 詳細ビュー */
    .detail-box {
      background: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .section-title {
      font-size: 15px; font-weight: bold; border-left: 4px solid #d4af37;
      padding-left: 8px; margin: 18px 0 10px; color: #222;
    }
    .evo-chain {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 13px;
    }
    .evo-step { background: #fff; padding: 4px 8px; border-radius: 6px; border: 1px solid #ddd; font-weight: bold; }
    .evo-arrow { color: #b5952f; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f8f8f8; color: #555; font-size: 12px; }
    .move-link { color: #1a73e8; text-decoration: underline; cursor: pointer; font-weight: bold; }

    /* マップタブ */
    .region-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .region-btn {
      flex: 1; padding: 10px; border: 1px solid #d4af37; background: #fff;
      color: #b5952f; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .region-btn.active { background: #d4af37; color: #fff; }
    .map-image-container {
      background: #fff; padding: 10px; border-radius: 10px; text-align: center;
      margin-bottom: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    .map-image { width: 100%; max-width: 650px; border-radius: 6px; display: block; margin: 0 auto; }

    .spot-group-title {
      font-size: 14px; font-weight: bold; color: #555; margin: 16px 0 8px;
      padding-bottom: 4px; border-bottom: 2px solid #e0e0e0;
    }
    .spot-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .spot-item {
      background: #fff; padding: 10px 12px; border-radius: 8px; border: 1px solid #e5e5e5;
      font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .spot-item:active { background: #fffdf5; border-color: #d4af37; }
    .spot-has-img { font-size: 11px; color: #d4af37; }

    /* モーダル */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); z-index: 999; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-card {
      background: #fff; width: 100%; max-width: 480px; border-radius: 12px;
      padding: 18px; max-height: 85vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 18px; font-weight: bold; color: #222; }
    .modal-close {
      background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%;
      font-size: 16px; font-weight: bold; cursor: pointer; color: #555;
    }
    .spot-category {
      display: inline-block; background: #f0e6c8; color: #7a6014;
      font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px;
    }

    /* 戻るフローティングボタン */
    .back-fab {
      display: none; position: fixed; bottom: 20px; right: 20px;
      background: #333; color: #fff; border: none; padding: 12px 18px;
      border-radius: 30px; font-size: 14px; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 200;
    }
  </style>
</head>
<body>

<header>ポケモン金銀クリスタル 攻略図鑑</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('pokedex', this)">ポケモン図鑑</button>
  <button class="tab-btn" onclick="switchTab('tm', this)">わざ・ひでんマシン</button>
  <button class="tab-btn" onclick="switchTab('map', this)">マップ攻略</button>
</div>

<div class="container">
  <!-- 図鑑タブ -->
  <div id="tab-pokedex">
    <div id="pokedex-list-view">
      <input type="text" id="pokeSearch" class="search-box" placeholder="ポケモン名・図鑑Noで検索（例: チコリータ, 152）" oninput="filterPokemon()">
      <div id="pokeGrid" class="poke-grid">読み込み中...</div>
    </div>
    <div id="pokedex-detail-view" style="display:none;"></div>
  </div>

  <!-- わざマシンタブ -->
  <div id="tab-tm" style="display:none;">
    <input type="text" id="tmSearch" class="search-box" placeholder="わざ名・マシン番号・入手場所で検索..." oninput="renderTMList()">
    <div id="tmListContainer"></div>
  </div>

  <!-- マップタブ -->
  <div id="tab-map" style="display:none;">
    <div class="region-switch">
      <button class="region-btn active" id="btn-johto" onclick="switchRegion('johto')">ジョウト地方</button>
      <button class="region-btn" id="btn-kanto" onclick="switchRegion('kanto')">カントー地方</button>
    </div>
    <div id="mapContent"></div>
  </div>
</div>

<button id="backFab" class="back-fab" onclick="closePokeDetail()">← 一覧へ戻る</button>

<!-- 技詳細モーダル -->
<div id="moveModal" class="modal-overlay" onclick="if(event.target===this) this.style.display='none'">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalMoveName">技名</div>
      <button class="modal-close" onclick="document.getElementById('moveModal').style.display='none'">×</button>
    </div>
    <div id="modalMoveBody"></div>
  </div>
</div>

<!-- マップ詳細モーダル -->
<div id="mapModal" class="modal-overlay" onclick="if(event.target===this) this.style.display='none'">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalMapName">場所名</div>
      <button class="modal-close" onclick="document.getElementById('mapModal').style.display='none'">×</button>
    </div>
    <div id="modalMapBody"></div>
  </div>
</div>

<script>
  let pokedexData = [];
  let movesData = {};
  let currentRegion = 'johto';

  async function init() {
    try {
      const [pokeRes, movesRes] = await Promise.all([
        fetch('pokedex.json'),
        fetch('moves.json')
      ]);
      pokedexData = await pokeRes.json();
      movesData = await movesRes.json();

      renderPokemonGrid(pokedexData);
      renderTMList();
      renderMap('johto');
    } catch (e) {
      document.getElementById('pokeGrid').innerHTML = "<p>データの読み込みに失敗しました。moves.json と pokedex.json が同じフォルダにあるか確認してください。</p>";
      console.error(e);
    }
  }

  function switchTab(tabName, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-pokedex').style.display = tabName === 'pokedex' ? 'block' : 'none';
    document.getElementById('tab-tm').style.display = tabName === 'tm' ? 'block' : 'none';
    document.getElementById('tab-map').style.display = tabName === 'map' ? 'block' : 'none';
    document.getElementById('backFab').style.display = (tabName === 'pokedex' && document.getElementById('pokedex-detail-view').style.display === 'block') ? 'block' : 'none';
  }

  function renderPokemonGrid(list) {
    const grid = document.getElementById('pokeGrid');
    if (!list.length) {
      grid.innerHTML = "<p>該当するポケモンが見つかりません。</p>";
      return;
    }
    grid.innerHTML = list.map(p => `
      <div class="poke-card" onclick="openPokeDetail(${p.no})">
        <div class="poke-no">No.${String(p.no).padStart(3, '0')}</div>
        <div class="poke-name">${p.name}</div>
        <div>${p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>
      </div>
    `).join('');
  }

  function filterPokemon() {
    const q = document.getElementById('pokeSearch').value.trim();
    if (!q) {
      renderPokemonGrid(pokedexData);
      return;
    }
    const filtered = pokedexData.filter(p => p.name.includes(q) || String(p.no) === q || String(p.no).padStart(3, '0').includes(q));
    renderPokemonGrid(filtered);
  }

  function openPokeDetail(no) {
    const p = pokedexData.find(x => x.no === no);
    if (!p) return;

    document.getElementById('pokedex-list-view').style.display = 'none';
    const detailView = document.getElementById('pokedex-detail-view');
    detailView.style.display = 'block';
    document.getElementById('backFab').style.display = 'block';
    window.scrollTo(0, 0);

    let evoHtml = "<div style='font-size:13px; color:#666;'>進化なし</div>";
    if (p.evolution_family && p.evolution_family.length > 0) {
      evoHtml = `<div class="evo-chain">` + p.evolution_family.map(e =>
        `<span class="evo-step">${e.from}</span> <span class="evo-arrow">→ (${e.method}: ${e.condition}) →</span> <span class="evo-step">${e.to}</span>`
      ).join('<br>') + `</div>`;
    }

    const levelMovesHtml = p.level_up_moves.map(m => `
      <tr>
        <td>Lv.${m.level === 0 ? '基本' : m.level}</td>
        <td><span class="move-link" onclick="showMoveModal('${m.move}')">${m.move}</span></td>
        <td>${m.version}</td>
      </tr>
    `).join('');

    const tmHtml = p.tm_moves.map(m => `
      <tr>
        <td><b>${m.code}</b></td>
        <td><span class="move-link" onclick="showMoveModal('${m.name}')">${m.name}</span></td>
      </tr>
    `).join('');

    const hmHtml = p.hm_moves.map(m => `
      <tr>
        <td><b>${m.code}</b></td>
        <td><span class="move-link" onclick="showMoveModal('${m.name}')">${m.name}</span></td>
      </tr>
    `).join('');

    detailView.innerHTML = `
      <div class="detail-box">
        <div class="poke-no">No.${String(p.no).padStart(3, '0')}</div>
        <h2 style="margin:4px 0 8px;">${p.name}</h2>
        <div>${p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>

        <div class="section-title">進化ルート</div>
        ${evoHtml}

        <div class="section-title">レベルアップで覚える技</div>
        <table>
          <thead><tr><th>Lv</th><th>技名</th><th>備考</th></tr></thead>
          <tbody>${levelMovesHtml || '<tr><td colspan="3">なし</td></tr>'}</tbody>
        </table>

        <div class="section-title">わざマシン</div>
        <table>
          <thead><tr><th>番号</th><th>技名</th></tr></thead>
          <tbody>${tmHtml || '<tr><td colspan="2">なし</td></tr>'}</tbody>
        </table>

        <div class="section-title">ひでんマシン</div>
        <table>
          <thead><tr><th>番号</th><th>技名</th></tr></thead>
          <tbody>${hmHtml || '<tr><td colspan="2">なし</td></tr>'}</tbody>
        </table>
      </div>
    `;
  }

  function closePokeDetail() {
    document.getElementById('pokedex-detail-view').style.display = 'none';
    document.getElementById('pokedex-list-view').style.display = 'block';
    document.getElementById('backFab').style.display = 'none';
  }

  function showMoveModal(moveName) {
    const info = movesData.moves ? movesData.moves[moveName] : null;
    document.getElementById('modalMoveName').innerText = moveName;
    if (info) {
      document.getElementById('modalMoveBody').innerHTML = `
        <div style="margin-bottom:10px;">
          <span class="type-badge type-${info.type}">${info.type}</span>
          <span style="font-size:12px; background:#eee; padding:2px 8px; border-radius:4px; font-weight:bold;">${info.category}</span>
        </div>
        <table>
          <tr><th>威力</th><td>${info.power}</td></tr>
          <tr><th>命中</th><td>${info.accuracy}</td></tr>
          <tr><th>PP</th><td>${info.pp}</td></tr>
        </table>
      `;
    } else {
      document.getElementById('modalMoveBody').innerHTML = `<p>詳細データが見つかりませんでした。</p>`;
    }
    document.getElementById('moveModal').style.display = 'flex';
  }

  function renderTMList() {
    const q = document.getElementById('tmSearch').value.trim();
    const container = document.getElementById('tmListContainer');
    if (!movesData.tm || !movesData.hm) return;

    let html = `<div class="detail-box"><div class="section-title" style="margin-top:0;">ひでんマシン一覧</div><table><thead><tr><th>No</th><th>技名</th><th>入手場所</th></tr></thead><tbody>`;
    for (const [code, info] of Object.entries(movesData.hm)) {
      if (!q || code.includes(q.toUpperCase()) || info.name.includes(q) || info.place.includes(q)) {
        html += `<tr><td><b>${code}</b></td><td><span class="move-link" onclick="showMoveModal('${info.name}')">${info.name}</span></td><td>${info.place}</td></tr>`;
      }
    }
    html += `</tbody></table><div class="section-title">わざマシン一覧</div><table><thead><tr><th>No</th><th>技名</th><th>入手場所</th></tr></thead><tbody>`;
    for (const [code, info] of Object.entries(movesData.tm)) {
      if (!q || code.includes(q.toUpperCase()) || info.name.includes(q) || info.place.includes(q)) {
        html += `<tr><td><b>${code}</b></td><td><span class="move-link" onclick="showMoveModal('${info.name}')">${info.name}</span></td><td>${info.place}</td></tr>`;
      }
    }
    html += `</tbody></table></div>`;
    container.innerHTML = html;
  }

  function switchRegion(region) {
    currentRegion = region;
    document.getElementById('btn-johto').classList.toggle('active', region === 'johto');
    document.getElementById('btn-kanto').classList.toggle('active', region === 'kanto');
    renderMap(region);
  }

  function renderMap(region) {
    const regionData = movesData.maps ? movesData.maps[region] : null;
    const container = document.getElementById('mapContent');
    if (!regionData) {
      container.innerHTML = "<p>マップデータがありません。</p>";
      return;
    }

    const defaultImg = region === 'johto' ? 'johto-allmap.jpg' : 'kanto-allmap.jpg';
    const allMapSrc = regionData.allMapImg || defaultImg;

    let html = `
      <div class="map-image-container">
        <img src="${allMapSrc}" alt="${regionData.title}" class="map-image"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; color:#999; font-size:12px; padding:18px;">
          ※ 全体マップ画像（<b>${allMapSrc}</b>）をフォルダ直下に配置すると表示されます
        </div>
      </div>
    `;

    const categories = ["町・都市", "ダンジョン・施設", "道路", "水道"];
    categories.forEach(cat => {
      const spots = regionData.spots.filter(s => s.category === cat);
      if (spots.length > 0) {
        html += `<div class="spot-group-title">${cat}</div><div class="spot-list">`;
        spots.forEach(spot => {
          const spotJson = encodeURIComponent(JSON.stringify(spot));
          const hasImgBadge = spot.mapImg ? `<span class="spot-has-img">🗺️</span>` : '';
          html += `<div class="spot-item" onclick="showMapDetail('${spotJson}')"><span>${spot.name}</span>${hasImgBadge}</div>`;
        });
        html += `</div>`;
      }
    });

    container.innerHTML = html;
  }

  function showMapDetail(spotEncoded) {
    const spot = JSON.parse(decodeURIComponent(spotEncoded));
    document.getElementById('modalMapName').innerText = spot.name;

    let imgHtml = "";
    if (spot.mapImg) {
      imgHtml = `
        <div style="text-align:center; background:#222; padding:8px; border-radius:8px; margin-bottom:12px;">
          <img src="${spot.mapImg}" alt="${spot.name}マップ"
               style="width:100%; max-height:260px; object-fit:contain; border-radius:6px;"
               onerror="this.parentElement.style.display='none';">
        </div>
      `;
    }

    document.getElementById('modalMapBody').innerHTML = `
      ${imgHtml}
      <div style="margin-bottom:8px;"><span class="spot-category">${spot.category}</span></div>
      <div style="line-height:1.6; color:#444; margin-bottom:10px; font-size:14px;">${spot.desc}</div>
      <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
      <div style="font-size:13px; margin-bottom:8px;">🏢 <b>主な施設：</b><br>${spot.facilities || "特になし"}</div>
      <div style="font-size:13px;">🎁 <b>入手できるアイテム：</b><br>${spot.items || "特になし"}</div>
    `;
    document.getElementById('mapModal').style.display = 'flex';
  }

  init();
</script>

</body>
</html>
